server.port=${SERVER_PORT:18080}

mdreader.content.storage=mysql
mdreader.progress.storage=mysql
mdreader.cors.allowed-origins=${MDREADER_CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.datasource.url=${MDREADER_DB_URL:jdbc:mysql://localhost:3306/mdreader?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MDREADER_DB_USERNAME:mdreader}
spring.datasource.password=${MDREADER_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/mysql/schema.sql
